apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zensur
  namespace: argo-cd
  annotations:
    argocd-image-updater.argoproj.io/image-list: zensur=ghcr.io/sglre6355/zensur:latest
    argocd-image-updater.argoproj.io/zensur.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  project: default
  sources:
    - path: manifests/overlays/production
      repoURL: https://github.com/sglre6355/zensur-manifests
      targetRevision: HEAD
      kustomize: {}
    - path: applications/zensur
      repoURL: https://github.com/sglre6355/external-secrets-manifests
      targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
